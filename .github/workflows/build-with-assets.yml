name: Build Assets

on:
  push:
    branches:
      - '**'   # Match all branches
  workflow_dispatch:

jobs:
  deploy-and-generate:
    runs-on: ubuntu-latest

    # Run only if push was to main or gh-pages-src
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gh-pages-src'

    steps:
      # 1️⃣ Checkout the branch that triggered the workflow
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # 2️⃣ Set CURRENT_BRANCH environment variable
      - name: Determine current branch
        run: echo "CURRENT_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      # 3️⃣ If not main, wipe current branch and checkout main to get latest assets
      - name: Checkout main if needed and wipe current files
        run: |
          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "Triggered from $CURRENT_BRANCH, wiping current branch contents..."
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            git fetch origin main:main
            git checkout main
          fi

      # 4️⃣ Prepare _temp folder
      - name: Prepare _temp folder
        run: |
          rm -rf _temp
          mkdir -p _temp

      # 5️⃣ Copy top-level vehicle folders into _temp (ignore hidden folders and _temp itself)
      - name: Copy vehicle folders to _temp
        run: |
          mkdir -p _temp
          shopt -s dotglob
          for item in *; do
            [[ "$item" == .* || "$item" == "_temp" ]] && continue
            cp -r "$item" _temp/
          done

      # 6️⃣ Checkout gh-pages-src branch (create if it doesn't exist)
      - name: Checkout gh-pages-src
        run: |
          ls _temp
          git checkout gh-pages-src || git checkout -b gh-pages-src
          ls

      # 7️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # 8️⃣ Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 9️⃣ Run gen_docs.py
      - name: Generate MkDocs docs
        run: python gen_docs.py

      # 🔟 Delete _temp folder
      - name: Clean up _temp folder
        run: rm -rf _temp

      # 1️⃣2️⃣ Build and deploy MkDocs to gh-pages
      - name: Build and deploy site
        run: mkdocs gh-deploy --force --clean
